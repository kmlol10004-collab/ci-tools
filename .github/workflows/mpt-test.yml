name: mpt-test

on:
  workflow_dispatch:
    inputs:
      script:
        description: Arabic script (skips LLM script generation)
        required: false
        default: "هل تنشر كل يوم ولا يتفاعل أحد؟ إليك ثلاث عادات بسيطة تغيّر النتيجة. أولاً، انشر في الوقت الذي يكون فيه جمهورك متصلاً، لا في الوقت الذي يناسبك أنت. ثانياً، ابدأ كل منشور بجملة قصيرة تثير الفضول. ثالثاً، ردّ على التعليقات في أول ساعة، فالتفاعل السريع يجعل المنشور يصل إلى عدد أكبر. جرّب هذه العادات أسبوعاً واحداً وراقب الفرق."
      voice:
        description: Edge TTS voice name
        required: false
        default: "ar-EG-ShakirNeural-Male"
      font:
        description: Font filename saved under resource/fonts
        required: false
        default: "Cairo-Regular.ttf"

permissions:
  contents: read

env:
  MPT_SHA: d47783266cfad72663c8bf84b59694a9034450b0
  SCRIPT: ${{ inputs.script }}
  VOICE: ${{ inputs.voice }}
  FONT: ${{ inputs.font }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: System info
        run: |
          nproc
          free -h
          df -h

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfribidi0 libharfbuzz0b jq time

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone MoneyPrinterTurbo at pinned commit
        run: |
          git clone https://github.com/harry0703/MoneyPrinterTurbo.git mpt
          cd mpt
          git checkout "$MPT_SHA"

      - name: Install Python dependencies
        working-directory: mpt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Pillow raqm (Arabic shaping) support
        working-directory: mpt
        run: python -c "from PIL import features; print('raqm', features.check('raqm'))" | tee raqm.txt

      - name: Download stock clips (need at least 3 of 5)
        run: |
          mkdir -p mpt/storage/local_videos
          urls=(
            "https://assets.mixkit.co/videos/242/242-720.mp4"
            "https://assets.mixkit.co/videos/47002/47002-720.mp4"
            "https://assets.mixkit.co/videos/4809/4809-720.mp4"
            "https://assets.mixkit.co/videos/41174/41174-720.mp4"
            "https://assets.mixkit.co/videos/4915/4915-720.mp4"
          )
          ok=0
          i=0
          for u in "${urls[@]}"; do
            i=$((i + 1))
            if curl -fsSL --retry 2 -o "mpt/storage/local_videos/clip$i.mp4" "$u"; then
              ok=$((ok + 1))
            else
              echo "failed to download $u"
              rm -f "mpt/storage/local_videos/clip$i.mp4"
            fi
          done
          echo "downloaded $ok/5 clips"
          if [ "$ok" -lt 3 ]; then
            echo "fewer than 3 clips downloaded, aborting"
            exit 1
          fi
          echo "CLIP_COUNT=$ok" >> "$GITHUB_ENV"

      - name: Download Arabic font
        run: |
          mkdir -p mpt/resource/fonts
          curl -fsSL -o "mpt/resource/fonts/$FONT" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"

      - name: Generate the video with the MoneyPrinterTurbo CLI
        working-directory: mpt
        run: |
          materials=$(ls storage/local_videos/*.mp4 | xargs -n1 basename | paste -sd,)
          set +e
          /usr/bin/time -v -o ../time.txt python cli.py \
            --video-subject "ثلاث عادات تزيد تفاعل صفحتك" \
            --video-script "$SCRIPT" \
            --video-terms "social media phone,typing laptop,people smartphone,office work,clock time" \
            --video-source local \
            --video-materials "$materials" \
            --video-aspect 9:16 \
            --voice-name "$VOICE" \
            --font-name "$FONT" \
            --font-size 90 \
            --subtitle-enabled \
            --subtitle-position bottom \
            > ../driver_stdout.json 2> ../driver.log
          status=$?
          set -e
          cat ../driver.log
          cat ../time.txt
          mkdir -p ../out
          cp ../driver.log ../time.txt ../driver_stdout.json raqm.txt ../out/ || true
          exit $status

      - name: Collect outputs
        working-directory: mpt
        run: |
          mkdir -p ../out
          cp ../driver.log ../out/driver.log
          python - <<'PY'
          import json, os, re, subprocess, shutil

          with open("../driver_stdout.json", encoding="utf-8") as f:
              lines = [x for x in f.read().splitlines() if x.lstrip().startswith("{")]
          data = json.loads(lines[-1])
          result = data["result"]
          video_path = result["videos"][0]
          sub_path = result.get("subtitle_path") or ""

          shutil.copy(video_path, "../out/mpt_arabic.mp4")
          if sub_path and os.path.isfile(sub_path):
              shutil.copy(sub_path, "../out/mpt_arabic.srt")

          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-select_streams", "v:0",
               "-show_entries", "stream=width,height:format=duration",
               "-of", "json", "../out/mpt_arabic.mp4"],
              capture_output=True, text=True, check=True,
          )
          pdata = json.loads(probe.stdout)
          width = pdata["streams"][0]["width"]
          height = pdata["streams"][0]["height"]
          duration = float(pdata["format"]["duration"])

          for i in range(4):
              ts = max(0.1, duration * (i + 1) / 5)
              subprocess.run(
                  ["ffmpeg", "-y", "-ss", str(ts), "-i", "../out/mpt_arabic.mp4",
                   "-frames:v", "1", f"../out/frame_{i+1}.png"],
                  check=True, capture_output=True,
              )

          timelog = open("../time.txt", encoding="utf-8", errors="replace").read()
          elapsed_m = re.search(r"Elapsed \(wall clock\).*?(\d+):([\d.]+)", timelog)
          seconds = (
              int(elapsed_m.group(1)) * 60 + float(elapsed_m.group(2))
              if elapsed_m else -1
          )
          rss_m = re.search(r"Maximum resident set size \(kbytes\): (\d+)", timelog)
          peak_mb = int(rss_m.group(1)) // 1024 if rss_m else -1

          raqm = open("raqm.txt", encoding="utf-8").read().strip()
          size_mb = os.path.getsize("../out/mpt_arabic.mp4") / 1024 / 1024

          with open("../out/r.txt", "w", encoding="utf-8") as f:
              f.write(f"commit_sha: {os.environ['MPT_SHA']}\n")
              f.write(f"python_version: {subprocess.run(['python','-V'],capture_output=True,text=True).stdout.strip()}\n")
              f.write(f"{raqm}\n")
              f.write(f"font: {os.environ['FONT']}\n")
              f.write(f"voice: {os.environ['VOICE']}\n")
              f.write(f"clips_downloaded: {os.environ.get('CLIP_COUNT', '?')}/5\n")
              f.write(f"generation_seconds: {seconds:.1f}\n")
              f.write(f"peak_ram_mb: {peak_mb}\n")
              f.write(f"video_duration_seconds: {duration:.2f}\n")
              f.write(f"resolution: {width}x{height}\n")
              f.write(f"file_size_mb: {size_mb:.2f}\n")
          PY
          cat ../out/r.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-test
          path: out/
          if-no-files-found: warn
