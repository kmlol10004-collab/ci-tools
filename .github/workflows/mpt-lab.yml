name: mpt-lab

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Session length in minutes (how long to keep polling for jobs)
        required: false
        default: "120"

permissions:
  contents: read

concurrency:
  group: mpt-lab
  cancel-in-progress: false

env:
  KW_BROKER_URL: ${{ secrets.KW_BROKER_URL }}
  KW_MEDIA_TOKEN: ${{ secrets.KW_MEDIA_TOKEN }}
  MPT_SHA: d47783266cfad72663c8bf84b59694a9034450b0
  MINUTES: ${{ inputs.minutes }}

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: System info
        run: |
          nproc
          free -h
          df -h

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfribidi0 libharfbuzz0b jq time fonts-noto-core
          ffmpeg -filters | grep -i subtitles || { echo "libass subtitles filter missing"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone MoneyPrinterTurbo at pinned commit
        run: |
          git clone https://github.com/harry0703/MoneyPrinterTurbo.git mpt
          cd mpt
          git checkout "$MPT_SHA"

      - name: Install Python dependencies
        working-directory: mpt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Pillow raqm (Arabic shaping) support
        working-directory: mpt
        run: python -c "from PIL import features; print('raqm', features.check('raqm'))"

      - name: Download Arabic font
        run: |
          mkdir -p mpt/resource/fonts
          curl -fsSL -o "mpt/resource/fonts/Cairo-Regular.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"

      - name: Lab loop
        run: |
          set -uo pipefail
          ROOT="$PWD"
          LAB="${KW_BROKER_URL%gh_broker.php}kw_lab.php"
          UA="kw-lab/1.0"
          AUTHH="Authorization: Bearer ${KW_MEDIA_TOKEN}"
          mkdir -p work cache artifacts "mpt/storage/local_videos"
          : > session.txt

          log() { echo "[$(date -u +%H:%M:%S)] $*"; }

          # collect.py: ffprobe + frame grabs + r.txt
          cat > collect.py <<'PYEOF'
          import json, os, re, subprocess, sys
          video, outdir, timefile, mode, gen_s, enc_s, materials = sys.argv[1:8]
          gen_s, enc_s = float(gen_s), float(enc_s)
          duration, width, height = 0.0, 0, 0
          try:
              p = subprocess.run(["ffprobe", "-v", "error", "-select_streams", "v:0",
                  "-show_entries", "stream=width,height:format=duration", "-of", "json", video],
                  capture_output=True, text=True, check=True)
              d = json.loads(p.stdout)
              width, height = d["streams"][0]["width"], d["streams"][0]["height"]
              duration = float(d["format"]["duration"])
          except Exception as exc:
              print(f"warning: ffprobe failed: {exc}", file=sys.stderr)
          for i in range(4 if duration > 0 else 0):
              ts = max(0.1, duration * (i + 1) / 5)
              try:
                  subprocess.run(["ffmpeg", "-y", "-ss", str(ts), "-i", video, "-frames:v", "1",
                      os.path.join(outdir, f"frame_{i+1}.png")], check=True, capture_output=True)
              except Exception as exc:
                  print(f"warning: frame {i+1} failed: {exc}", file=sys.stderr)
          timelog = open(timefile, encoding="utf-8", errors="replace").read() if os.path.isfile(timefile) else ""
          em = re.search(r"Elapsed \(wall clock\).*?(\d+):([\d.]+)", timelog)
          gen_seconds = (int(em.group(1)) * 60 + float(em.group(2))) if em else gen_s
          rm = re.search(r"Maximum resident set size \(kbytes\): (\d+)", timelog)
          peak_mb = int(rm.group(1)) // 1024 if rm else -1
          size_mb = os.path.getsize(video) / 1024 / 1024 if os.path.isfile(video) else -1
          for line in (f"mode: {mode}", f"generation_seconds: {gen_seconds:.1f}",
                       f"encode_seconds: {enc_s:.1f}", f"peak_ram_mb: {peak_mb}",
                       f"video_duration_seconds: {duration:.2f}", f"resolution: {width}x{height}",
                       f"file_size_mb: {size_mb:.2f}", f"clips_used: {materials}"):
              print(line)
          PYEOF

          # broker helpers
          fetch_job_file() { # id, remote name, local dest
            curl -fsS -A "$UA" -H "$AUTHH" --max-time 60 \
              "$LAB?op=file&job=$1&name=$2" -o "$3"
          }
          post_result() { # id, local file, remote name
            curl -fsS -A "$UA" -H "$AUTHH" --max-time 300 \
              --data-binary "@$2" "$LAB?op=result&job=$1&name=$3" >/dev/null \
              || curl -fsS -A "$UA" -H "$AUTHH" --max-time 300 \
                 --data-binary "@$2" "$LAB?op=result&job=$1&name=$3" >/dev/null
          }
          post_done() { # id, ok(true|false), note, took
            local note_json=$(python3 -c 'import json,sys;print(json.dumps(sys.argv[1]))' "$3")
            curl -fsS -A "$UA" -H "$AUTHH" -H "Content-Type: application/json" --max-time 30 \
              -d "{\"ok\":$2,\"note\":$note_json,\"took\":$4}" \
              "$LAB?op=done&job=$1" >/dev/null
          }
          job_fail() { # id, t0, note
            local took=$(( $(date +%s) - $2 ))
            local note=$(printf '%s' "$3" | tail -c 4000)
            post_done "$1" false "$note" "$took"
            echo "$(date -u +%FT%TZ) id=$1 status=failed took=${took}s note=$note" >> "$ROOT/session.txt"
            log "job $1: FAILED - $note"
          }
          cache_clip() { # url -> prints local cached path on stdout
            local url="$1"
            local key=$(printf '%s' "$url" | md5sum | cut -d' ' -f1)
            local ext="${url##*.}"
            [ ${#ext} -gt 4 ] && ext="mp4"
            local dest="$ROOT/cache/${key}.${ext}"
            if [ ! -s "$dest" ]; then
              curl -fsSL --retry 2 -A "$UA" -o "$dest" "$url" || { rm -f "$dest"; return 1; }
            fi
            printf '%s' "$dest"
          }

          # run one job
          run_job() {
            local job="$1" F
            # one jq call, 0x01-joined, instead of 15 separate invocations
            mapfile -d $'\x01' -t F < <(jq -j '[.id,.title,.mode,.script,.terms,.aspect,.font,
              (.font_size|tostring),(.sub_style//""),.bgm_type,(.bgm_volume|tostring),.voice,
              (.audio_file//""),(.srt_file//""),(.extra//"")] | join("\u0001")' <<<"$job")
            local id="${F[0]}" title="${F[1]}" mode="${F[2]}" script="${F[3]}" terms="${F[4]}" aspect="${F[5]}"
            local font="${F[6]}" font_size="${F[7]}" sub_style="${F[8]}" bgm_type="${F[9]}" bgm_volume="${F[10]}"
            local voice="${F[11]}" audio_file="${F[12]}" srt_file="${F[13]}" extra="${F[14]}"

            local t0=$(date +%s)
            local wd="$ROOT/work/$id"
            mkdir -p "$wd/out"
            printf '%s' "$job" > "$wd/job.json"
            log "job $id: start mode=$mode title=$title"

            local audio_abs="" srt_abs=""
            if [ -n "$audio_file" ]; then
              audio_abs="$wd/voice.mp3"
              fetch_job_file "$id" "$audio_file" "$audio_abs" || { job_fail "$id" "$t0" "failed to fetch $audio_file"; return; }
            fi
            if [ -n "$srt_file" ]; then
              srt_abs="$wd/subs.srt"
              fetch_job_file "$id" "$srt_file" "$srt_abs" || { job_fail "$id" "$t0" "failed to fetch $srt_file"; return; }
            fi

            local materials=() i=0 url cached ext mname
            while IFS= read -r url; do
              [ -z "$url" ] && continue
              i=$((i + 1))
              cached=$(cache_clip "$url") || { log "job $id: clip $i download failed, skipping"; continue; }
              ext="${cached##*.}"
              mname="${id}_${i}.${ext}"
              cp "$cached" "$ROOT/mpt/storage/local_videos/$mname" && materials+=("$mname")
            done < <(jq -r '.clips[]?' <<<"$job")
            if [ "${#materials[@]}" -lt 1 ]; then
              job_fail "$id" "$t0" "no clips could be downloaded"
              return
            fi
            local materials_csv=$(IFS=,; echo "${materials[*]}")
            log "job $id: materials ready (${#materials[@]} clips)"

            local cmd=(python cli.py
              --video-subject "$title" --video-script "$script" --video-terms "$terms"
              --video-source local --video-materials "$materials_csv" --video-aspect "$aspect"
              --bgm-type "$bgm_type" --bgm-volume "$bgm_volume")
            if [ "$mode" = "custom_audio" ]; then
              cmd+=(--custom-audio-file "$audio_abs" --no-subtitle-enabled)
            else
              cmd+=(--voice-name "$voice" --subtitle-enabled --subtitle-position bottom
                    --font-name "$font" --font-size "$font_size")
            fi
            if [ -n "$extra" ]; then
              cmd+=($extra) # word-split on purpose, for ad-hoc experiments
            fi

            local gen_t0=$(date +%s)
            ( cd "$ROOT/mpt" && /usr/bin/time -v -o "$wd/time.txt" "${cmd[@]}" \
                > "$wd/driver_stdout.json" 2> "$wd/driver.log" )
            local status=$?
            local gen_seconds=$(( $(date +%s) - gen_t0 ))
            log "job $id: cli.py exit=$status (${gen_seconds}s)"
            if [ $status -ne 0 ]; then
              job_fail "$id" "$t0" "cli.py exit $status: $(tail -n 60 "$wd/driver.log")"
              return
            fi

            local last video_path sub_path
            last=$(grep -h '^{' "$wd/driver_stdout.json" | tail -n1)
            video_path=$(jq -r '.result.videos[0] // empty' <<<"$last" 2>/dev/null)
            sub_path=$(jq -r '.result.subtitle_path // empty' <<<"$last" 2>/dev/null)
            if [ -z "$video_path" ] || [ ! -f "$video_path" ]; then
              job_fail "$id" "$t0" "no output video: $(tail -n 60 "$wd/driver.log")"
              return
            fi

            local enc_seconds=0
            if [ "$mode" = "custom_audio" ]; then
              local enc_t0=$(date +%s)
              local style vh lfs
              # libass renders an SRT on a 384x288 canvas scaled to the video, so
              # convert the wanted pixel size into that scale (80 px on 1920 -> 12)
              vh=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video_path" 2>/dev/null || echo 1920)
              [ "$vh" -gt 0 ] 2>/dev/null || vh=1920
              lfs=$(( font_size * 288 / vh ))
              [ "$lfs" -lt 8 ] && lfs=8
              if [ -n "$sub_style" ]; then
                style="subtitles=${srt_abs}:fontsdir=${ROOT}/mpt/resource/fonts:force_style='${sub_style}'"
              else
                style="subtitles=${srt_abs}:fontsdir=${ROOT}/mpt/resource/fonts:force_style='FontName=Cairo,FontSize=${lfs},Outline=1,Shadow=0,Bold=0,MarginV=22,Alignment=2,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000'"
              fi
              log "job $id: burn style FontSize=$lfs (video height $vh)"
              ffmpeg -y -i "$video_path" -vf "$style" -c:v libx264 -preset medium -crf 18 \
                -c:a copy -movflags +faststart "$wd/out/final.mp4" >> "$wd/driver.log" 2>&1
              if [ $? -ne 0 ]; then
                job_fail "$id" "$t0" "ffmpeg subtitle burn failed: $(tail -n 60 "$wd/driver.log")"
                return
              fi
              cp "$srt_abs" "$wd/out/subs.srt"
              enc_seconds=$(( $(date +%s) - enc_t0 ))
              log "job $id: subtitles burned (${enc_seconds}s)"
            else
              cp "$video_path" "$wd/out/final.mp4"
              [ -n "$sub_path" ] && [ -f "$sub_path" ] && cp "$sub_path" "$wd/out/subs.srt"
            fi
            cp "$wd/driver.log" "$wd/out/driver.log"

            python3 "$ROOT/collect.py" "$wd/out/final.mp4" "$wd/out" "$wd/time.txt" \
              "$mode" "$gen_seconds" "$enc_seconds" "$materials_csv" > "$wd/out/r.txt" 2>> "$wd/driver.log"

            for f in "$wd"/out/*; do
              post_result "$id" "$f" "$(basename "$f")" \
                || log "job $id: failed to post $(basename "$f")"
            done

            mkdir -p "$ROOT/artifacts/$id"
            for f in "$wd"/out/*; do
              local bn=$(basename "$f")
              if [ "$bn" = "final.mp4" ] && [ "$(stat -c%s "$f")" -gt 62914560 ]; then
                continue
              fi
              cp "$f" "$ROOT/artifacts/$id/$bn"
            done

            local took=$(( $(date +%s) - t0 ))
            post_done "$id" true "ok" "$took"
            echo "$(date -u +%FT%TZ) id=$id status=done took=${took}s mode=$mode title=$title" >> "$ROOT/session.txt"
            log "job $id: done (${took}s total)"
          }

          # main poll loop
          DEADLINE=$(( $(date +%s) + MINUTES * 60 - 180 ))
          log "session deadline in $(( DEADLINE - $(date +%s) ))s (minutes=$MINUTES, 180s reserved for upload)"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            resp=$(curl -sS -A "$UA" -H "$AUTHH" --max-time 10 "$LAB?op=next" 2>/dev/null)
            if [ -z "$resp" ]; then
              log "poll: network error, retrying in 30s"
              sleep 30
              continue
            fi
            job=$(jq -c '.job // empty' <<<"$resp" 2>/dev/null)
            if [ -z "$job" ] || [ "$job" = "null" ]; then
              sleep 15
              continue
            fi
            run_job "$job"
          done
          log "session loop ended"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-lab
          path: |
            artifacts/
            session.txt
          if-no-files-found: warn
