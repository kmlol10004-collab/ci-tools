name: mpt-lab

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Session length in minutes (how long to keep polling for jobs)
        required: false
        default: "120"

permissions:
  contents: read

concurrency:
  group: mpt-lab
  cancel-in-progress: false

env:
  KW_BROKER_URL: ${{ secrets.KW_BROKER_URL }}
  KW_MEDIA_TOKEN: ${{ secrets.KW_MEDIA_TOKEN }}
  MPT_SHA: d47783266cfad72663c8bf84b59694a9034450b0
  MINUTES: ${{ inputs.minutes }}

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: System info
        run: |
          nproc
          free -h
          df -h

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfribidi0 libharfbuzz0b jq time fonts-noto-core
          ffmpeg -filters | grep -i subtitles || { echo "libass subtitles filter missing"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone MoneyPrinterTurbo at pinned commit
        run: |
          git clone https://github.com/harry0703/MoneyPrinterTurbo.git mpt
          cd mpt
          git checkout "$MPT_SHA"

      - name: Install Python dependencies
        working-directory: mpt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Pillow raqm (Arabic shaping) support
        working-directory: mpt
        run: python -c "from PIL import features; print('raqm', features.check('raqm'))"

      - name: Download Arabic font
        run: |
          mkdir -p mpt/resource/fonts
          curl -fsSL -o "mpt/resource/fonts/Cairo-Regular.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"

      - name: Lab loop
        # the loop logic is served by the broker, so it can change without a new upload here
        run: |
          LAB="${KW_BROKER_URL%gh_broker.php}kw_lab.php"
          curl -fsS -A kw-lab/1.0 -H "Authorization: Bearer $KW_MEDIA_TOKEN" --max-time 30 "$LAB?op=script" -o lab.sh
          head -c 200 lab.sh | grep -q "KWAMLE MPT lab loop" || { echo "lab.sh not served"; exit 1; }
          bash lab.sh

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-lab
          path: |
            artifacts/
            session.txt
          if-no-files-found: warn
