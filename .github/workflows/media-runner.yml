name: media-runner

# An extra media worker for the box. It holds no code of its own: the engines
# are fetched from the broker at start-up, so this public repo never contains
# anything but this file.
#
# Sessions die without warning (GitHub's own cause: "the hosted runner lost
# communication with the server"). Nothing here tries to prevent that — an
# unfinished job simply stops beating and the box runs it locally instead.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# At most one session at a time, with one queued behind it. The queued run
# starts the moment the live one dies, which is the restart mechanism — no
# self-dispatch token needed.
concurrency:
  group: media-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Room to work
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h / | tail -1

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Fetch the engines from the box
        env:
          BROKER: ${{ secrets.KW_BROKER_URL }}
          TOKEN: ${{ secrets.KW_MEDIA_TOKEN }}
        run: |
          test -n "$BROKER" || { echo "KW_BROKER_URL secret is not set"; exit 1; }
          test -n "$TOKEN"  || { echo "KW_MEDIA_TOKEN secret is not set"; exit 1; }
          mkdir -p ~/vps && cd ~/vps
          curl -sS -f -m 180 -H "X-GH-Token: $TOKEN" "$BROKER?op=bundle" -o bundle.tgz
          tar -xzf bundle.tgz
          ls -la gh_media

      - name: Work
        env:
          GH_BROKER: ${{ secrets.KW_BROKER_URL }}
          GH_TOKEN: ${{ secrets.KW_MEDIA_TOKEN }}
          GH_SLOTS: '2'
        run: |
          cd ~/vps/gh_media
          chmod +x run.sh
          ./run.sh
